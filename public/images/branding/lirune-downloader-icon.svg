<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lirune Downloader app icon</title>
  <desc id="desc">Premium midnight-blue rounded-square icon with an original cyan geometric L and download-arrow monogram.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="80" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173653"/>
      <stop offset=".52" stop-color="#10243B"/>
      <stop offset="1" stop-color="#091426"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(390 300) rotate(49) scale(660)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D8CAC" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3D8CAC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGradient" x1="300" y1="220" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9AF6F4"/>
      <stop offset=".48" stop-color="#62D2E8"/>
      <stop offset="1" stop-color="#4B9BE8"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="80" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A4EAF5" stop-opacity=".36"/>
      <stop offset="1" stop-color="#4B80B8" stop-opacity=".07"/>
    </linearGradient>
    <filter id="softShadow" x="180" y="170" width="700" height="700" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="226" fill="url(#background)"/>
  <rect x="24" y="24" width="976" height="976" rx="226" fill="url(#ambient)"/>
  <rect x="25" y="25" width="974" height="974" rx="225" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <!-- Soft, restrained glow behind the original monogram. -->
  <g opacity=".22" filter="url(#softShadow)">
    <path d="M365 248 V614 C365 669 410 714 465 714 H735 M590 354 V552 M492 461 L590 559 L688 461"
          fill="none" stroke="#53CBE8" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M365 248 V614 C365 669 410 714 465 714 H735"
        fill="none" stroke="url(#markGradient)" stroke-width="112"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590 354 V552 M492 461 L590 559 L688 461"
        fill="none" stroke="url(#markGradient)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M365 248 V614 C365 669 410 714 465 714"
        fill="none" stroke="#E1FFFF" stroke-opacity=".27" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
