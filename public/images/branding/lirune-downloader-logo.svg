<svg 
  
  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Backdrop -->
  <rect width="800" height="240" rx="24" fill="url(#bgGrad)" />
  <!-- Brandmark Shield -->
  <g transform="translate(40, 20)">
    <polygon points="100,10 180,45 180,145 100,195 20,145 20,45" 
             fill="none" stroke="#0284C7" stroke-width="8" stroke-linejoin="round"/>
    <!-- L Monogram -->
    <rect x="55" y="45" width="22" height="105" rx="6" fill="#00F0FF" />
    <rect x="55" y="130" width="85" height="22" rx="6" fill="#00F0FF" />
    <!-- Downward Arrow -->
    <polygon points="100,175 145,100 120,100 120,55 80,55 80,100 55,100" fill="#38BDF8" />
    <polygon points="100,160 125,110 100,125 75,110" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <!-- Wordmark -->
  <text x="250" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="2">LIRUNE</text>
  <text x="495" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="54" font-weight="300" fill="#00F0FF" letter-spacing="1">DOWNLOADER</text>
  <!-- Tagline -->
  <text x="252" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="1.5">YOUR DOWNLOADS &#8226; YOUR DEVICE &#8226; YOUR CONTROL</text>
  <!-- Upload Guard Badge -->
  <g transform="translate(252, 180)">
    <rect width="180" height="22" rx="11" fill="#03254C" stroke="#00F0FF" stroke-width="1"/>
    <text x="90" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1">ZERO-UPLOAD ENGINE</text>
  </g>
</svg>
